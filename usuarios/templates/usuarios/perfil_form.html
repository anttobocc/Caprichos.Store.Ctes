{% extends "usuarios/base_usuarios.html" %}

{% block title %}Editar mis datos | Capricho{% endblock %}

{% block content %}
<main class="auth-page">
    <h1>Editar mis datos</h1>

    <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar</button>
    </form>

    <p><a href="{% url 'usuarios:perfil' %}">Volver a mi perfil</a></p>
</main>
{% endblock %}
