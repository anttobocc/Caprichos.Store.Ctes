{% extends "usuarios/base_usuarios.html" %}

{% block title %}Iniciar sesión | Capricho{% endblock %}

{% block content %}
<main class="auth-page">
    <h1>Iniciar sesión</h1>

    {% if form.errors %}
        <p class="form-error">Usuario o contraseña incorrectos.</p>
    {% endif %}

    <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Ingresar</button>
    </form>

    <p><a href="{% url 'usuarios:registro' %}">¿No tenés cuenta? Registrate</a></p>
</main>
{% endblock %}
