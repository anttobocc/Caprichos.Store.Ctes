{% load static %}
<article class="producto-card">
    {% if combo.imagen %}
        <img src="{{ combo.imagen.url }}" alt="{{ combo.nombre }}" class="producto-card__imagen-link">
    {% else %}
        <div class="producto-card__sin-imagen" aria-hidden="true">🎁</div>
    {% endif %}
    <div class="producto-card__cuerpo">
        <p class="producto-card__categoria">Combo</p>
        <h3>{{ combo.nombre }}</h3>
        {% if combo.descripcion %}<p class="producto-card__descripcion">{{ combo.descripcion }}</p>{% endif %}

        {% if combo.precio_individual_total %}
            <p class="producto-card__unidad"><s>${{ combo.precio_individual_total }}</s></p>
        {% endif %}
        <p class="producto-card__precio">${{ combo.precio_promocional }}</p>
    </div>
    <svg class="producto-card__decor" viewBox="0 0 120 160" aria-hidden="true">
        <path d="M18 148 C 40 115 55 90 102 18" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        <path d="M24 136 C 14 130 8 118 14 108 C 24 112 28 126 24 136 Z" stroke="currentColor" stroke-width="1.2" fill="none"/>
        <path d="M39 112 C 52 108 62 112 64 122 C 52 126 41 122 39 112 Z" stroke="currentColor" stroke-width="1.2" fill="none"/>
        <path d="M54 88 C 44 82 38 70 44 60 C 54 64 58 78 54 88 Z" stroke="currentColor" stroke-width="1.2" fill="none"/>
        <path d="M69 64 C 82 60 92 64 94 74 C 82 78 71 74 69 64 Z" stroke="currentColor" stroke-width="1.2" fill="none"/>
        <path d="M85 40 C 75 34 70 24 75 15 C 84 19 88 31 85 40 Z" stroke="currentColor" stroke-width="1.2" fill="none"/>
        <path d="M98 22 C 105 19 111 21 112 27 C 105 29 99 27 98 22 Z" stroke="currentColor" stroke-width="1" fill="none"/>
    </svg>
</article>
