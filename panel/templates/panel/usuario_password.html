{% extends "panel/base_panel.html" %}

{% block title %}Cambiar contraseña | Panel Capricho{% endblock %}

{% block panel_content %}
<h1>Cambiar contraseña de "{{ usuario.username }}"</h1>

<form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Cambiar contraseña</button>
</form>

<p><a href="{% url 'panel:usuarios' %}">Volver al listado</a></p>
{% endblock %}
